spring.application.name=telecomapp

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

//Hibernate ? "I'll modify the database if necessary." 
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



//This database already has a schema that wasn't created by Flyway. Treat its current state as the starting point.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

//Customer email verification
app.email.verification-base-url=http://localhost:5173

# Email sender configuration
app.email.from-address=no-reply@telecomapp.local

# Local SMTP server for development
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000